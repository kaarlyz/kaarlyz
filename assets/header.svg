<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 210" width="100%" height="210">
  <defs>
    <style>
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes lineGlow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }

      .card-bg { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 6px; }
      .header-bar { fill: #1e293b; rx: 6px 6px 0 0; }
      .dot-red { fill: #ef4444; }
      .dot-yellow { fill: #f59e0b; }
      .dot-green { fill: #10b981; }
      .terminal-title { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; }
      
      .name { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
      .handle { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; font-weight: 600; }
      .tagline { fill: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
      
      .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 3px; }
      .badge-txt { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; }
      
      .loop-container { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 4px; }
      .loop-label { fill: #64748b; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; }
      .loop-step { fill: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
      .loop-arrow { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; font-weight: 700; }
      .cursor { fill: #38bdf8; animation: cursorBlink 1s infinite; }
      .accent-line { stroke: #38bdf8; stroke-width: 2; animation: lineGlow 3s infinite; }

      @media (prefers-color-scheme: light) {
        .card-bg { fill: #ffffff; stroke: #cbd5e1; }
        .header-bar { fill: #f1f5f9; }
        .terminal-title { fill: #64748b; }
        .name { fill: #0f172a; }
        .handle { fill: #0284c7; }
        .tagline { fill: #334155; }
        .badge-bg { fill: #f8fafc; stroke: #e2e8f0; }
        .badge-txt { fill: #0369a1; }
        .loop-container { fill: #f8fafc; stroke: #e2e8f0; }
        .loop-label { fill: #64748b; }
        .loop-step { fill: #1e293b; }
        .loop-arrow { fill: #0284c7; }
        .cursor { fill: #0284c7; }
        .accent-line { stroke: #0284c7; }
      }
    </style>
  </defs>

  <!-- Base Card -->
  <rect x="5" y="5" width="840" height="200" class="card-bg" />
  
  <!-- Header Bar -->
  <rect x="5" y="5" width="840" height="32" class="header-bar" />
  <circle cx="24" cy="21" r="5" class="dot-red" />
  <circle cx="40" cy="21" r="5" class="dot-yellow" />
  <circle cx="56" cy="21" r="5" class="dot-green" />
  <text x="75" y="25" class="terminal-title">eka@dev-box: ~/profile (zsh)</text>

  <!-- Main Content Area -->
  <g transform="translate(25, 45)">
    <!-- Name & Handle -->
    <text x="0" y="30" class="name">Eka <tspan class="handle">@kaarlyz</tspan></text>
    <text x="0" y="52" class="tagline">Student Developer • Building Operational Tools, Automation &amp; Web Infrastructure</text>
    
    <!-- Location & Status Badges -->
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="135" height="22" class="badge-bg" />
      <text x="10" y="15" class="badge-txt">📍 Indonesia (SMA)</text>

      <rect x="145" y="0" width="175" height="22" class="badge-bg" />
      <text x="155" y="15" class="badge-txt">⚡ Practical Engineering</text>

      <rect x="330" y="0" width="160" height="22" class="badge-bg" />
      <text x="340" y="15" class="badge-txt">🛠️ Build &gt; Tech Badges</text>
    </g>

    <!-- Engineering Loop Box -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="790" height="42" class="loop-container" />
      <text x="12" y="16" class="loop-label">ENGINEERING LOOP:</text>
      <text x="12" y="32" class="loop-step">
        learn <tspan class="loop-arrow">→</tspan> build <tspan class="loop-arrow">→</tspan> break <tspan class="loop-arrow">→</tspan> debug <tspan class="loop-arrow">→</tspan> understand <tspan class="loop-arrow">→</tspan> improve
      </text>
      <rect x="525" y="21" width="8" height="13" class="cursor" />
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="5" y1="203" x2="845" y2="203" class="accent-line" />
</svg>
