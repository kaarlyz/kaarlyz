<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <style>
      @keyframes animTs { from { width: 0px; } to { width: 492px; } }   /* 82% of 600px */
      @keyframes animJs { from { width: 0px; } to { width: 450px; } }   /* 75% of 600px */
      @keyframes animPy { from { width: 0px; } to { width: 408px; } }   /* 68% of 600px */
      @keyframes animSql { from { width: 0px; } to { width: 390px; } }  /* 65% of 600px */
      @keyframes animBash { from { width: 0px; } to { width: 360px; } } /* 60% of 600px */

      .skills-card { fill: #090d16; stroke: #27272a; stroke-width: 1.5; rx: 8px; }
      .bar-bg { fill: #27272a; rx: 4px; }
      .bar-ts { fill: #d4d4d8; rx: 4px; animation: animTs 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-js { fill: #facc15; rx: 4px; animation: animJs 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-py { fill: #a1a1aa; rx: 4px; animation: animPy 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-sql { fill: #d4d4d8; rx: 4px; animation: animSql 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-bash { fill: #a1a1aa; rx: 4px; animation: animBash 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      .lang-label { fill: #f8fafc; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 600; }
      .percent-label { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; font-weight: 600; }
      .disclaimer { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-style: italic; }

      @media (prefers-color-scheme: light) {
        .skills-card { fill: #ffffff; stroke: #cbd5e1; }
        .bar-bg { fill: #f1f5f9; }
        .lang-label { fill: #121214; }
        .percent-label { fill: #475569; }
        .disclaimer { fill: #64748b; }
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="5" y="5" width="790" height="230" class="skills-card" />

  <g transform="translate(25, 25)">
    <!-- TypeScript (82%) -->
    <text x="0" y="16" class="lang-label">TypeScript</text>
    <rect x="135" y="5" width="590" height="13" class="bar-bg" />
    <rect x="135" y="5" width="484" height="13" class="bar-ts" />
    <text x="735" y="16" class="percent-label">82%</text>

    <!-- JavaScript & Node (75%) -->
    <text x="0" y="51" class="lang-label">JavaScript (Node)</text>
    <rect x="135" y="40" width="590" height="13" class="bar-bg" />
    <rect x="135" y="40" width="442" height="13" class="bar-js" />
    <text x="735" y="51" class="percent-label">75%</text>

    <!-- Python (68%) -->
    <text x="0" y="86" class="lang-label">Python (Fast Scripting)</text>
    <rect x="135" y="75" width="590" height="13" class="bar-bg" />
    <rect x="135" y="75" width="401" height="13" class="bar-py" />
    <text x="735" y="86" class="percent-label">68%</text>

    <!-- SQL & SQLite (65%) -->
    <text x="0" y="121" class="lang-label">SQLite &amp; SQL (WAL)</text>
    <rect x="135" y="110" width="590" height="13" class="bar-bg" />
    <rect x="135" y="110" width="383" height="13" class="bar-sql" />
    <text x="735" y="121" class="percent-label">65%</text>

    <!-- Bash & Systems (60%) -->
    <text x="0" y="156" class="lang-label">Bash &amp; Linux CLI</text>
    <rect x="135" y="145" width="590" height="13" class="bar-bg" />
    <rect x="135" y="145" width="354" height="13" class="bar-bash" />
    <text x="735" y="156" class="percent-label">60%</text>

    <!-- Disclaimer -->
    <text x="135" y="195" class="disclaimer">⚡ Production frequency estimated from public git repositories &amp; operational systems.</text>
  </g>
</svg>