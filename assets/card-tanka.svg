<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Tanka - Grounded AI study engine for UTBK">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#71717a" stop-opacity=".30"/><stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2"><stop offset="0" stop-color="#52525b" stop-opacity=".16"/><stop offset="1" stop-color="#a1a1aa" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#27272a"/><stop offset=".42" stop-color="#27272a"/><stop offset=".5" stop-color="#d4d4d8"/><stop offset=".58" stop-color="#27272a"/><stop offset="1" stop-color="#27272a"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;560 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#71717a" opacity=".16"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="558" height="270" rx="16"/></clipPath>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#71717a" stop-opacity=".7"/><stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="558" height="270" rx="16" fill="url(#bg)"/>
