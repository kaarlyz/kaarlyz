<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="AetherParticles 3D - Hand-tracked real-time particle engine">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#060a14"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#a78bfa" stop-opacity=".30"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2"><stop offset="0" stop-color="#f472b6" stop-opacity=".16"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
<linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="0" spreadMethod="repeat"><stop offset="0" stop-color="#1e293b"/><stop offset=".42" stop-color="#1e293b"/><stop offset=".5" stop-color="#a78bfa"/><stop offset=".58" stop-color="#1e293b"/><stop offset="1" stop-color="#1e293b"/>
<animateTransform attributeName="gradientTransform" type="translate" values="0 0;560 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#a78bfa" opacity=".16"/></pattern>
<clipPath id="card"><rect x="1" y="1" width="558" height="270" rx="16"/></clipPath>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="558" height="270" rx="16" fill="url(#bg)"/>
<g clip-path="url(#card)"><rect width="560" height="272" fill="url(#dots)"/>
<circle cx="520" cy="30" r="140" fill="url(#gl)"><animate attributeName="r" values="120;165;120" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="30" cy="272" r="130" fill="url(#gl2)"><animate attributeName="r" values="110;150;110" dur="8s" repeatCount="indefinite"/></circle>
<text x="538" y="92" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="78" font-weight="800" fill="#a78bfa" opacity=".07">04</text>
<rect x="-120" y="0" width="90" height="272" fill="#a78bfa" opacity=".05" transform="skewX(-18)"><animate attributeName="x" values="-120;720" dur="7s" repeatCount="indefinite"/></rect></g>
<rect x="1" y="1" width="558" height="270" rx="16" fill="none" stroke="url(#sweep)" stroke-width="1.6"/>
<rect x="28" y="24" width="136" height="22" rx="11" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".45"/>
<text x="96" y="39" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1.6" fill="#a78bfa">COMPUTER VISION</text>
<text x="28" y="86" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="800" fill="#f8fafc">AetherParticles 3D</text>
<text x="28" y="110" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#a78bfa">Hand-tracked real-time particle engine</text>
<rect x="28" y="124" width="504" height="1" fill="url(#ln)"/>
<text x="28" y="152" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#f472b6">▸</text><text x="48" y="152" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">12,000 particles, NumPy-vectorized physics at 60 FPS</text>
<text x="28" y="177" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#f472b6">▸</text><text x="48" y="177" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">MediaPipe Tasks, rotation-invariant gesture classifier</text>
<text x="28" y="202" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#f472b6">▸</text><text x="48" y="202" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">8 formations: Heart, Saturn, Galaxy, Singularity…</text>
