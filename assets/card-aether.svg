<rect x="97" y="226" width="82" height="24" rx="7" fill="#0f172a" stroke="#1e293b"/><text x="138" y="242" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8">MediaPipe</text>
<rect x="188" y="226" width="54" height="24" rx="7" fill="#0f172a" stroke="#1e293b"/><text x="215" y="242" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8">NumPy</text>
<rect x="250" y="226" width="61" height="24" rx="7" fill="#0f172a" stroke="#1e293b"/><text x="281" y="242" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8">Pygame</text>
<rect x="319" y="226" width="34" height="24" rx="7" fill="#0f172a" stroke="#1e293b"/><text x="336" y="242" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8">CV</text>
