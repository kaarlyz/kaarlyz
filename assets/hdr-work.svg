<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="SELECTED WORK">
<defs>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4d4d8" stop-opacity="0"/><stop offset=".5" stop-color="#a1a1aa"/><stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/></linearGradient>
<linearGradient id="notch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d4d4d8"/><stop offset="1" stop-color="#d4d4d8" stop-opacity="0"/></linearGradient>
</defs>
<text x="6" y="42" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#d4d4d8" opacity="0">// 01<animate attributeName="opacity" values="0;1" dur=".6s" begin=".1s" fill="freeze"/></text>
<text x="66" y="44" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3.5" fill="#f1f5f9" opacity="0">SELECTED WORK<animate attributeName="opacity" values="0;1" dur=".8s" begin=".25s" fill="freeze"/></text>
