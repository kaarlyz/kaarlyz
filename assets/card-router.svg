<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="9Router Command Hub - AI gateway orchestrator over Telegram">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0d10"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
<radialGradient id="gl"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<radialGradient id="gl2"><stop offset="0" stop-color="#52525b" stop-opacity=".16"/><stop offset="1" stop-color="#a1a1aa" stop-opacity="0"/></radialGradient>
