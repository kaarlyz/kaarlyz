<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #121214; stroke: #27272a; stroke-width: 2px; }
      .title { fill: #F8FAFC; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 28px; font-weight: 800; }
      .handle { fill: #d4d4d8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .tagline { fill: #94A3B8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 500; }
      .badge-bg { fill: #27272a; stroke: #3f3f46; stroke-width: 1px; }
      .badge-text { fill: #d4d4d8; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .avatar-ring { stroke: #d4d4d8; stroke-width: 3px; fill: none; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #FFFFFF; stroke: #E2E8F0; }
        .title { fill: #121214; }
        .handle { fill: #71717a; }
        .tagline { fill: #475569; }
        .badge-bg { fill: #F1F5F9; stroke: #E2E8F0; }
        .badge-text { fill: #71717a; }
        .avatar-ring { stroke: #71717a; }
      }
    </style>
    <clipPath id="avatar-clip">
      <circle cx="700" cy="100" r="60" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect class="bg" x="2" y="2" width="796" height="196" rx="16" ry="16" />

  <!-- Avatar Circle Image & Ring -->
  <image href="https://avatars.githubusercontent.com/u/197458243?v=4" x="640" y="40" width="120" height="120" clip-path="url(#avatar-clip)" />
  <circle class="avatar-ring" cx="700" cy="100" r="60" />

  <!-- Profile Info Text -->
  <text class="title" x="40" y="65">Eka Restu Syahputra</text>
  <text class="handle" x="40" y="95">@kaarlyz • High School Student &amp; Developer</text>
  <text class="tagline" x="40" y="125">Just a Student Who Ships Operational Tools</text>

  <!-- Status / Location Badges -->
  <g transform="translate(40, 142)">
    <!-- Badge 1: Location -->
    <rect class="badge-bg" x="0" y="0" width="125" height="28" rx="6" />
    <text class="badge-text" x="12" y="18">📍 Indonesia 🇮🇩</text>

    <!-- Badge 2: Status -->
    <rect class="badge-bg" x="135" y="0" width="145" height="28" rx="6" />
    <text class="badge-text" x="147" y="18">⚡ Building Janka</text>

    <!-- Badge 3: Focus -->
    <rect class="badge-bg" x="290" y="0" width="155" height="28" rx="6" />
    <text class="badge-text" x="302" y="18">🛠️ Logistics &amp; Trading</text>
  </g>
</svg>
